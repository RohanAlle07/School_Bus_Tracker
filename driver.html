<!DOCTYPE html>
<html>
<head>
  <title>Bus Driver</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial; text-align: center; padding: 40px; }
    button { font-size: 24px; padding: 20px 40px; margin: 10px; }
    #status { margin-top: 20px; font-size: 18px; }
  </style>
</head>
<body>
  <h1>Bus Driver</h1>
  <button id="startBtn" onclick="startTracking()">Start Route</button>
  <button id="stopBtn" onclick="stopTracking()" disabled>Stop Route</button>
  <div id="status">Ready</div>

  <script>
    const supabase = window.supabase.createClient(
      'https://naesyzhoiwwvpfgxsfqt.supabase.co',
      'sb_publishable_uGPlvXMtG6ERI9HzJOgzlw_vrRkUfft'
    );

    let watchId = null;

    async function startTracking() {
      document.getElementById('startBtn').disabled = true;
      document.getElementById('stopBtn').disabled = false;
      document.getElementById('status').innerText = 'Getting location...';

      if (!navigator.geolocation) {
        alert('Geolocation is not supported');
        return;
      }

      watchId = navigator.geolocation.watchPosition(
        async (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;

          const { error } = await supabase
            .from('locations')
            .upsert({
              bus_id: 'bus_01',
              lat: lat,
              lng: lng,
              updated_at: new Date().toISOString()
            }, { onConflict: 'bus_id' });

          if (error) {
            document.getElementById('status').innerText = 'Error: ' + error.message;
          } else {
            document.getElementById('status').innerText = 
              `Sending: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
          }
        },
        (err) => {
          document.getElementById('status').innerText = 'Location error: ' + err.message;
        },
        { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
      );
    }

    function stopTracking() {
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
      document.getElementById('startBtn').disabled = false;
      document.getElementById('stopBtn').disabled = true;
      document.getElementById('status').innerText = 'Stopped';
    }
  </script>
</body>
</html>
