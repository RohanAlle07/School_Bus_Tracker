<!DOCTYPE html>
<html>
<head>
  <title>Track the Bus</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { margin: 0; padding: 0; }
    #map { height: 100vh; width: 100%; }
    #info { position: absolute; top: 10px; left: 10px; z-index: 1000; background: white; padding: 10px; border-radius: 5px; box-shadow: 0 0 5px rgba(0,0,0,0.3); }
  </style>
</head>
<body>
  <div id="info">Waiting for bus location...</div>
  <div id="map"></div>

  <script>
    const sb = window.supabase.createClient(
      'https://naesyzhoiwwvpfgxsfqt.supabase.co',
      'sb_publishable_uGPlvXMtG6ERI9HzJOgzlw_vrRkUfft'
    );

    const map = L.map('map').setView([42.1, -72.6], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let busMarker = null;

    function updateMarker(lat, lng, time) {
      if (!busMarker) {
        busMarker = L.marker([lat, lng]).addTo(map)
          .bindPopup('Bus')
          .openPopup();
        map.setView([lat, lng], 15);
      } else {
        busMarker.setLatLng([lat, lng]);
      }
      const t = time ? new Date(time).toLocaleTimeString() : 'just now';
      document.getElementById('info').innerText = `Last update: ${t}`;
    }

    // Load any existing location first
    async function loadInitial() {
      const { data, error } = await sb
        .from('locations')
        .select('*')
        .eq('bus_id', 'bus_01')
        .maybeSingle();

      if (data) {
        updateMarker(data.lat, data.lng, data.updated_at);
      } else if (error) {
        console.error(error);
      }
    }

    // Realtime updates
    sb.channel('locations-changes')
      .on('postgres_changes', 
        { event: '*', schema: 'public', table: 'locations', filter: 'bus_id=eq.bus_01' }, 
        (payload) => {
          const loc = payload.new;
          if (loc) {
            updateMarker(loc.lat, loc.lng, loc.updated_at);
          }
        }
      )
      .subscribe();

    loadInitial();
  </script>
</body>
</html>
